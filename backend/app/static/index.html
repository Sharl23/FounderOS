<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FounderOS</title>
  <meta name="description" content="Evidence-first venture decisions with a local open-weight model.">
  <link rel="stylesheet" href="/assets/style.css">
  <script>try { var t = localStorage.getItem('founderos_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="side" aria-label="FounderOS navigation">
      <a class="brand" href="/projects" data-link><span class="brand-mark" aria-hidden="true"></span><b>FounderOS</b></a>
      <nav class="nav nav-group" id="workspace-nav" aria-label="Workflow">
        <a href="/projects" data-link id="nav-projects"><span class="num" aria-hidden="true">≡</span><span>Projects</span></a>
        <div class="nav-title" id="nav-venture-title" hidden>This venture</div>
        <div id="nav-steps" class="nav-group"></div>
        <div class="nav-title">Reference</div>
        <a href="/roadmap" data-link id="nav-roadmap"><span class="num" aria-hidden="true">◇</span><span>Six-phase roadmap</span></a>
        <a href="/help" data-link id="nav-help"><span class="num" aria-hidden="true">?</span><span>How it works</span></a>
      </nav>
      <div class="side-foot">Draft-only prototype. FounderOS never publishes, sends, spends, signs or handles payments.</div>
    </aside>
    <div class="frame">
      <header class="top">
        <div class="crumb"><strong id="crumb-title">FounderOS</strong><span id="crumb-sub">Evidence-first venture decisions</span></div>
        <button class="model" id="model-status" type="button" data-s="unknown" title="Check the local model"><span class="dot" aria-hidden="true"></span><span id="model-label">Checking model</span></button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme">Dark</button>
      </header>
      <main id="main" tabindex="-1" aria-live="off"></main>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <script src="/assets/app.js"></script>
</body>
</html>
